name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Check the release tag matches the built version
        run: |
          built=$(python -c "import glob, re; print(re.search(r'-([^-]+)-py3', glob.glob('dist/*.whl')[0]).group(1))")
          if [ "$built" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match built version ${built}"
            exit 1
          fi
      - uses: pypa/gh-action-pypi-publish@release/v1
